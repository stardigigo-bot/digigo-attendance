<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديجيجو - إدارة الفريق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('dg_theme');if(_t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(x){}</script>
<style>
:root{--bg:#f6f4fb;--sf:#fff;--sf2:#faf8ff;--tx:#1d1533;--mu:#6e6787;--bd:#e9e3f5;--pr:#6d28d9;--pr2:#8b5cf6;--prs:rgba(109,40,217,.09);--gl:rgba(109,40,217,.2);--sh:0 1px 2px rgba(30,15,60,.05),0 10px 30px rgba(30,15,60,.07);--side:#fff;
--ok:#16a34a;--oks:rgba(22,163,74,.12);--wn:#f59e0b;--wns:rgba(245,158,11,.14);--rd:#ef4444;--rds:rgba(239,68,68,.12);--bl:#3b82f6;--bls:rgba(59,130,246,.12);--vi:#8b5cf6;--pk:#db2777;--dr:#b91c1c;color-scheme:light}
[data-theme="dark"]{--bg:#110c1d;--sf:#1a1330;--sf2:#20173a;--tx:#eee9fb;--mu:#a59cc0;--bd:#2e2450;--pr:#a78bfa;--pr2:#8b5cf6;--prs:rgba(167,139,250,.12);--gl:rgba(139,92,246,.28);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);--side:#150f26;--oks:rgba(34,197,94,.15);--wns:rgba(245,158,11,.16);--rds:rgba(239,68,68,.16);--bls:rgba(59,130,246,.16);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--tx);background:var(--bg);line-height:1.6;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden;background:radial-gradient(1000px 600px at 100% 0,rgba(139,92,246,.18),transparent),radial-gradient(800px 500px at 0 100%,rgba(219,39,119,.1),transparent),var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:float 14s ease-in-out infinite}
.blob.a{width:340px;height:340px;background:#a78bfa;top:-80px;left:-60px}.blob.b{width:280px;height:280px;background:#f0abfc;bottom:-60px;right:-40px;animation-delay:-5s}.blob.c{width:200px;height:200px;background:#93c5fd;top:40%;left:55%;animation-delay:-9s;opacity:.35}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
.lgw{position:relative;z-index:1;width:100%;max-width:880px;animation:up .6s cubic-bezier(.2,.8,.2,1)}
.lgh{text-align:center;margin-bottom:22px}.lgh img{height:64px;background:#fff;border-radius:16px;padding:6px 16px;box-shadow:var(--sh)}
.lgh h1{margin:12px 0 2px;font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--pr),#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}.lgh p{margin:0;color:var(--mu)}
.lgc{background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:24px;padding:22px;box-shadow:var(--sh)}
.lgs h3{margin:14px 0 8px;font-size:13px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:8px}.lgs h3:first-child{margin-top:0}.lgs h3:after{content:"";flex:1;height:1px;background:var(--bd)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.wb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1.5px solid var(--bd);background:var(--sf);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;animation:up .5s both}
.wb:hover{transform:translateY(-4px);border-color:var(--pr2);box-shadow:0 12px 28px var(--gl)}.wb b{font-size:14px}.wb small{color:var(--mu);font-size:11px}
.adm-l{margin-top:16px;display:flex;justify-content:center}
/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:var(--side);border-left:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}.brand img{height:38px;background:#fff;border-radius:10px;padding:3px 8px;border:1px solid var(--bd)}.brand b{display:block;font-size:15px;font-weight:900;color:var(--pr)}.brand small{color:var(--mu);font-size:11px}
.mecard{margin:4px 12px 8px;padding:10px;border-radius:14px;background:linear-gradient(135deg,var(--prs),transparent);border:1px solid var(--bd);display:flex;align-items:center;gap:10px}.mecard b{display:block;font-size:14px;line-height:1.3}.mecard small{color:var(--mu);font-size:11px}
#snav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.ni{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border:0;background:none;border-radius:11px;color:var(--mu);font-weight:700;cursor:pointer;text-align:right;position:relative;transition:background .2s,color .2s,transform .2s}
.ni:hover{background:var(--prs);color:var(--pr);transform:translateX(-3px)}
.ni.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;box-shadow:0 6px 18px var(--gl)}
.ni .lbl{flex:1}.nsep{font-size:11px;color:var(--mu);font-weight:700;padding:14px 12px 4px;opacity:.8}
.bdg{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--rd);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;animation:pop .35s}
.side-ft{padding:10px 12px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.conn{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px;flex:1}.conn i{width:8px;height:8px;border-radius:50%;background:var(--mu)}.conn.ok i{background:var(--ok);box-shadow:0 0 0 3px var(--oks)}.conn.bad i{background:var(--rd)}
#mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.top h1{margin:0;font-size:19px;font-weight:900;flex:1;animation:fadeIn .4s}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .burger{display:none}
main{padding:20px;max-width:1280px;width:100%;margin:0 auto}
#scrim{display:none}
@media(max-width:900px){#side{position:fixed;right:0;top:0;transform:translateX(105%);box-shadow:var(--sh)}#side.open{transform:none}.top .burger{display:inline-flex}#scrim.open{display:block;position:fixed;inset:0;background:rgba(10,5,25,.4);z-index:35;animation:fadeIn .25s}main{padding:14px}.top{padding:10px 14px}.top h1{font-size:16px}}
/* ---------- base comps ---------- */
.box{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);transition:border-color .25s,box-shadow .25s,background .3s}
.box.hl:hover{border-color:var(--pr2)}
h2{font-size:16px;margin:22px 0 10px;color:var(--tx);font-weight:800;display:flex;align-items:center;gap:8px}h2 .i{color:var(--pr)}
.sh{display:flex;align-items:center;gap:8px;margin:20px 0 10px;flex-wrap:wrap}.sh h2{margin:0}.sh .sp{flex:1}
.n{color:var(--mu);font-size:12px;margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent;padding:8px 16px;border-radius:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .18s,box-shadow .25s,background .25s,border-color .25s,opacity .2s;position:relative;overflow:hidden;background:var(--sf2);color:var(--tx);border-color:var(--bd)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px var(--gl)}.btn:active:not(:disabled){transform:translateY(0) scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.btn.g{background:linear-gradient(135deg,#15803d,#22c55e);color:#fff;border-color:transparent}.btn.g:hover{box-shadow:0 8px 18px rgba(34,197,94,.35)}
.btn.b{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-color:transparent}.btn.b:hover{box-shadow:0 8px 18px rgba(59,130,246,.35)}
.btn.o{background:linear-gradient(135deg,#d97706,#fbbf24);color:#1d1533;border-color:transparent}.btn.o:hover{box-shadow:0 8px 18px rgba(245,158,11,.35)}
.btn.r{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;border-color:transparent}.btn.r:hover{box-shadow:0 8px 18px rgba(239,68,68,.35)}
.btn.k{background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;border-color:transparent}
.btn.gh{background:none}.btn.sm{padding:5px 10px;font-size:12px;border-radius:10px}.btn.lg{padding:12px 22px;font-size:15px;border-radius:14px}.btn.ic{padding:8px;border-radius:12px}
.btn.x{background:none;border:0;color:var(--rd);padding:3px 6px}.btn.x:hover{box-shadow:none;text-decoration:underline}.btn.x.e{color:var(--pr)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pr2);outline-offset:2px}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:8px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px;font-weight:600}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf2);color:var(--tx);transition:border-color .2s,box-shadow .2s,background .3s;min-width:0}
textarea{resize:vertical;min-height:70px}
input:hover,select:hover,textarea:hover{border-color:var(--pr2)}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr2);box-shadow:0 0 0 4px var(--gl)}
.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer;color:var(--tx)}.chk input{width:18px;height:18px;accent-color:var(--pr)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--rd);font-weight:700}.w{color:var(--wn);font-weight:700}
.tg{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--prs);color:var(--pr);white-space:nowrap}
.tg.ok{background:var(--oks);color:var(--ok)}.tg.no{background:var(--rds);color:var(--rd)}.tg.w{background:var(--wns);color:#b45309}.tg.v{background:var(--prs);color:var(--pr)}.tg.bl{background:var(--bls);color:var(--bl)}
[data-theme="dark"] .tg.w{color:var(--wn)}
.scr{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:700;font-size:12px;background:var(--sf2);position:sticky;top:0}th:first-child{border-radius:0 10px 10px 0}th:last-child{border-radius:10px 0 0 10px}
tr{transition:background .2s}tbody tr:hover td,tr:hover td{background:var(--prs)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.k:hover{transform:translateY(-3px);box-shadow:0 14px 30px var(--gl)}
.k:before{content:"";position:absolute;inset:0 0 auto auto;width:70px;height:70px;border-radius:50%;background:var(--kc,var(--pr2));opacity:.1;transform:translate(-50%,-30%)}
.k small{color:var(--mu);display:block;font-size:12px;font-weight:600}.k b{font-size:24px;font-weight:900;color:var(--kc,var(--pr));display:block;line-height:1.4}.k .ki{position:absolute;left:14px;top:14px;color:var(--kc,var(--pr));opacity:.75}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
/* avatar */
.av{--c:#7c3aed;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));flex:none;font-size:14px;box-shadow:0 3px 10px color-mix(in srgb,var(--c) 35%,transparent);position:relative}
.av.lg{width:54px;height:54px;font-size:21px}.av.sm{width:26px;height:26px;font-size:11px}
.av[data-s]:after{content:"";position:absolute;bottom:-1px;left:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--sf);background:var(--mu)}
.av[data-s="ok"]:after{background:var(--ok);animation:pulse 2s infinite}.av[data-s="wn"]:after{background:var(--wn)}.av[data-s="rd"]:after{background:var(--rd)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* banners */
.bnw{position:relative;border-radius:22px;overflow:hidden;margin-bottom:16px;min-height:130px;box-shadow:var(--sh)}
.bn{position:absolute;inset:0;padding:22px 26px;color:#fff;display:flex;align-items:center;gap:18px;opacity:0;transform:translateX(-30px);transition:opacity .7s,transform .7s;background-size:cover;background-position:center}
.bn.on{opacity:1;transform:none;position:relative}
.bn:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);left:-60px;top:-120px}.bn:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);left:120px;bottom:-90px}
.bn .em{font-size:46px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2));animation:bob 3s ease-in-out infinite;position:relative;z-index:1}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.bn h3{margin:0;font-size:22px;font-weight:900;position:relative;z-index:1}.bn p{margin:2px 0 0;opacity:.92;position:relative;z-index:1}
.bdots{position:absolute;bottom:10px;left:18px;display:flex;gap:6px;z-index:2}.bdots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.5);cursor:pointer;transition:width .3s,background .3s}.bdots i.on{width:22px;background:#fff}
/* punch */
.punch{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pring{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;border:4px solid var(--pc,var(--rd));color:var(--pc,var(--rd));background:color-mix(in srgb,var(--pc,var(--rd)) 10%,transparent);position:relative}
.pring.ok{--pc:var(--ok)}.pring.wn{--pc:var(--wn)}.pring.rd{--pc:var(--rd)}.pring.mu{--pc:var(--mu)}
.pring.ok:after,.pring.wn:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--pc);opacity:.4;animation:ring 2.2s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.18);opacity:0}}
.pring b{font-size:17px}.pring small{font-size:10px;font-weight:700}
.pinfo{flex:1;min-width:180px}.pinfo h3{margin:0 0 2px;font-size:17px}.pinfo p{margin:0;color:var(--mu)}
.pbtn{display:flex;gap:8px;flex-wrap:wrap}
/* tasks */
.tcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.tcol{background:var(--sf2);border:1px solid var(--bd);border-radius:18px;padding:10px;min-height:120px}
.tcol>header{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:800;font-size:13.5px}
.tcol>header i{width:10px;height:10px;border-radius:50%;background:var(--sc)}.tcol>header span{margin-inline-start:auto;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:0 9px;font-size:12px;color:var(--mu)}
.tc{--sc:var(--mu);background:var(--sf);border:1px solid var(--bd);border-right:4px solid var(--sc);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .45s both;position:relative}
.tc:hover{transform:translateY(-3px);box-shadow:0 14px 30px var(--gl)}
.tc.run{box-shadow:0 0 0 2px var(--bl),0 12px 30px rgba(59,130,246,.25)}
.tc.run:before{content:"";position:absolute;inset:-1px;border-radius:14px;border:2px solid var(--bl);opacity:.6;animation:breath 1.8s ease-in-out infinite;pointer-events:none}
@keyframes breath{50%{opacity:0}}
.tc h4{margin:0 0 4px;font-size:14.5px;font-weight:800;line-height:1.45}
.tc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;font-size:12px;color:var(--mu)}
.tc .dt{font-size:12.5px;color:var(--mu);margin:4px 0;white-space:pre-wrap;max-height:60px;overflow:hidden}
.tc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tc .who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--tx)}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.tmr{font-variant-numeric:tabular-nums;font-weight:800;direction:ltr;display:inline-block}
.tmr.live{color:var(--bl)}
.over{color:var(--rd)!important}
.hero{background:linear-gradient(135deg,#1e3a8a,#3b82f6 55%,#60a5fa);color:#fff;border-radius:22px;padding:20px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 18px 40px rgba(59,130,246,.3);margin-bottom:14px;position:relative;overflow:hidden;animation:up .5s both}
.hero:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.1);left:-80px;top:-150px}
.hero.idle{background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 18px 40px var(--gl)}.hero.hold{background:linear-gradient(135deg,#b45309,#f59e0b)}
.hero .big{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:1px;position:relative}
.hero h3{margin:0;font-size:19px;position:relative}.hero p{margin:2px 0 0;opacity:.9;position:relative}.hero .sp{flex:1;min-width:200px;position:relative}.hero .btn{position:relative}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--mu);transition:.2s}.seg button.on{background:var(--sf);color:var(--pr);box-shadow:var(--sh)}
.aiq{display:flex;gap:8px;flex:1;min-width:260px;background:linear-gradient(135deg,var(--prs),transparent);border:1.5px dashed var(--pr2);border-radius:14px;padding:6px}.aiq input{flex:1;border:0;background:none;box-shadow:none!important}
/* lanes */
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.lanes{grid-template-columns:1fr}}
.lane{border-radius:20px;padding:12px;border:1px solid var(--bd);background:var(--sf2);position:relative;min-height:140px}
.lane>header{display:flex;align-items:center;gap:8px;font-weight:900;margin-bottom:10px;padding:2px 4px}.lane>header i{width:12px;height:12px;border-radius:50%;background:var(--lc)}
.lane>header span{margin-inline-start:auto;background:var(--lc);color:#fff;border-radius:99px;padding:0 10px;font-size:12px}
.lane.ok{--lc:var(--ok);background:linear-gradient(180deg,var(--oks),var(--sf2) 60%)}.lane.wn{--lc:var(--wn);background:linear-gradient(180deg,var(--wns),var(--sf2) 60%)}.lane.rd{--lc:var(--rd);background:linear-gradient(180deg,var(--rds),var(--sf2) 60%)}
.mchip{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;animation:slideIn .5s both;transition:transform .2s,box-shadow .2s}
.mchip:hover{transform:translateX(-4px);box-shadow:var(--sh)}
.mchip .nm{font-weight:800;color:var(--lc)}.mchip .sx{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.mchip .tm{margin-inline-start:auto;text-align:left;font-size:12px;color:var(--mu)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 140px);min-height:420px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.clist{border-left:1px solid var(--bd);overflow-y:auto;background:var(--sf2)}
.cit{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .2s}.cit:hover{background:var(--prs)}.cit.on{background:var(--prs);box-shadow:inset -3px 0 0 var(--pr)}
.cit b{display:block;font-size:13.5px}.cit small{color:var(--mu);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}.cit .bdg{margin-inline-start:auto}
.cthread{display:flex;flex-direction:column;min-width:0}
.chead{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;font-weight:800}
.cmsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(600px 300px at 50% 0,var(--prs),transparent)}
.msg{max-width:72%;padding:8px 12px;border-radius:16px;background:var(--sf2);border:1px solid var(--bd);align-self:flex-start;animation:pop .3s;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent;border-bottom-left-radius:4px}
.msg:not(.me){border-bottom-right-radius:4px}
.msg small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}.msg .fr{font-size:11px;font-weight:800;color:var(--pr);display:block}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}.cform textarea{flex:1;min-height:42px;height:42px;max-height:120px}
.cday{align-self:center;font-size:11px;color:var(--mu);background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:1px 10px;margin:6px 0}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}.clist{max-height:200px;border-left:0;border-bottom:1px solid var(--bd)}.cmsgs{height:50vh}}
/* AI */
#aiFab{position:fixed;left:20px;bottom:20px;z-index:60;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:conic-gradient(from 0deg,#7c3aed,#db2777,#3b82f6,#7c3aed);box-shadow:0 12px 30px rgba(124,58,237,.45);display:flex;align-items:center;justify-content:center;animation:spinb 6s linear infinite;transition:transform .25s}
#aiFab:hover{transform:scale(1.08)}#aiFab svg{width:26px;height:26px;animation:spinb 6s linear infinite reverse}
@keyframes spinb{to{background-position:0 0;filter:hue-rotate(360deg)}}
#aiP{position:fixed;left:20px;bottom:90px;z-index:61;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));background:var(--sf);border:1px solid var(--bd);border-radius:22px;box-shadow:0 30px 60px rgba(30,10,60,.3);display:flex;flex-direction:column;overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);transform-origin:bottom left}
#aiP>header{padding:14px 16px;background:linear-gradient(135deg,#5b21b6,#a855f7 60%,#db2777);color:#fff;display:flex;align-items:center;gap:10px}#aiP>header b{flex:1;font-size:15px}#aiP>header small{display:block;font-size:11px;opacity:.85;font-weight:500}
#aiL{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.am{padding:9px 12px;border-radius:14px;max-width:90%;white-space:pre-wrap;word-break:break-word;animation:pop .3s}.am.u{align-self:flex-end;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}.am.m{align-self:flex-start;background:var(--sf2);border:1px solid var(--bd)}
.acts-p{margin-top:8px;display:flex;flex-direction:column;gap:6px}.actc{border:1px dashed var(--pr2);border-radius:10px;padding:7px 9px;background:var(--sf);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chip{border:1px solid var(--bd);background:var(--sf2);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;transition:.2s}.chip:hover{border-color:var(--pr2);color:var(--pr)}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--pr2);animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-5px);opacity:.5}}
/* modal, toast */
.ov{position:fixed;inset:0;background:rgba(15,5,30,.45);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:99;animation:fadeIn .25s;padding:14px}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:20px;max-width:460px;width:100%;max-height:calc(100vh - 28px);overflow-y:auto;box-shadow:0 30px 70px rgba(20,5,40,.35);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.md.wide{max-width:620px}.md h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.md form{flex-direction:column;align-items:stretch}.md .row{display:flex;gap:10px;flex-wrap:wrap}.md .row>*{flex:1;min-width:130px}
.mbtns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{border:1.5px solid var(--bd);border-radius:12px;padding:9px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:700;color:var(--tx);font-size:13px;transition:.2s}.opt:hover{border-color:var(--pr2)}.opt:has(input:checked){border-color:var(--pr);background:var(--prs)}.opt input{accent-color:var(--pr)}
.ts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:14px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:tu .4s cubic-bezier(.2,.9,.3,1.2);font-weight:700;max-width:calc(100vw - 32px)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;direction:ltr}.pinpad button{padding:14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--sf2);font-size:20px;font-weight:800;cursor:pointer;transition:.15s}.pinpad button:hover{border-color:var(--pr2);background:var(--prs)}.pinpad button:active{transform:scale(.93)}
.dots{display:flex;justify-content:center;gap:14px;margin:12px 0;direction:ltr}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pr2);transition:background .2s,transform .2s}.dots i.f{background:var(--pr);transform:scale(1.15)}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cf{position:fixed;width:10px;height:14px;top:-20px;z-index:300;border-radius:2px;animation:fall 1.4s cubic-bezier(.3,.6,.5,1) forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.6}}
.lb{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--bd);margin-bottom:8px;background:var(--sf);animation:up .45s both}.lb .md2{font-size:24px;width:32px;text-align:center}.lb .bar{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--pr),#db2777);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:13px}.empty .e{font-size:34px;display:block;margin-bottom:4px}
.rich b{color:var(--pr)}
@keyframes fadeIn{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes tu{from{opacity:0;transform:translate(-50%,20px)}}
.anim>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(n+5){animation-delay:.2s}
.demo{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#f59e0b;color:#1d1533;font-weight:800;font-size:12px;padding:2px 14px;border-radius:0 0 10px 10px;z-index:500}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#side,.top,#aiFab,form,button,.toolbar{display:none!important}body{background:#fff}.box{box-shadow:none}}
</style>
</head>
