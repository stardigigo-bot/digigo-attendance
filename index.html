<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ديجيجو - الحضور والانصراف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2fa;--sf:#fff;--tx:#1e0f2e;--mu:#6b5f7c;--bd:#e2d9ee;--pr:#34064F;--ac:#6A32B0;--ok:#16895e;--wn:#c98a00;--rd:#c0392b;--hd:#34064F;--hdt:#fff;--onp:#fff;--st:#b79be0;--gl:rgba(106,50,176,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c21;--sf:#1f1331;--tx:#efe8f8;--mu:#a99bc0;--bd:#3a2a55;--pr:#c4a2f5;--ac:#8f5fd6;--ok:#4fd1a0;--wn:#f0b429;--rd:#ef6a5b;--hd:#1a0630;--hdt:#efe8f8;--onp:#1a0630;--st:#6b4aa8;--gl:rgba(143,95,214,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150c21;--sf:#1f1331;--tx:#efe8f8;--mu:#a99bc0;--bd:#3a2a55;--pr:#c4a2f5;--ac:#8f5fd6;--ok:#4fd1a0;--wn:#f0b429;--rd:#ef6a5b;--hd:#1a0630;--hdt:#efe8f8;--onp:#1a0630;--st:#6b4aa8;--gl:rgba(143,95,214,.3);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--tx);line-height:1.6;background:radial-gradient(900px 420px at 90% -10%,rgba(106,50,176,.16),transparent),radial-gradient(700px 420px at 0 100%,rgba(52,6,79,.12),transparent),var(--bg);background-attachment:fixed}
header{background:linear-gradient(120deg,var(--hd),#5b21a0 75%,#7b3fd0);color:var(--hdt);padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(52,6,79,.3);position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:20px;font-weight:900}.hb{display:flex;align-items:center;gap:14px}.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg{height:46px;width:auto;background:#fff;border-radius:10px;padding:4px 12px;display:block;transition:transform .3s}.lg:hover{transform:scale(1.05) rotate(-1deg)}
header label{color:inherit}header input{background:rgba(255,255,255,.14);color:inherit;border-color:rgba(255,255,255,.4)}
.hbtn{font-family:inherit;background:rgba(255,255,255,.14);color:inherit;border:1.5px solid rgba(255,255,255,.45);padding:7px 16px;border-radius:10px;font-weight:700;cursor:pointer;transition:.25s}.hbtn:hover{background:#fff;color:#34064F}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--sf);border-bottom:1.5px solid var(--st)}
nav button{font-family:inherit;border:1.5px solid transparent;background:none;padding:8px 16px;border-radius:10px;color:var(--mu);font-weight:700;cursor:pointer;white-space:nowrap;font-size:14px;transition:.25s}
nav button:hover{border-color:var(--st);color:var(--pr)}nav button.on{background:var(--pr);color:var(--onp);border-color:var(--pr);box-shadow:0 4px 14px var(--gl)}
main{padding:18px;max-width:1180px;margin:auto}
h2{font-size:17px;margin:22px 0 8px;color:var(--pr)}
.box,.k,.cd{background:var(--sf);border:1.5px solid var(--st);border-radius:14px;padding:14px;margin-bottom:12px;transition:border-color .25s,box-shadow .25s,transform .25s}
.box:hover,.k:hover{border-color:var(--ac);box-shadow:0 8px 28px var(--gl)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp .k{margin:0}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:20px;color:var(--pr)}
.scr{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--pr);font-weight:700;font-size:13px;background:rgba(106,50,176,.07)}
tbody tr,tr{transition:background .2s}tr:hover td{background:rgba(106,50,176,.06)}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:8px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{font-family:inherit;padding:8px 10px;border:1.5px solid var(--st);border-radius:10px;background:var(--bg);color:var(--tx);font-size:14px;transition:.25s}
input:hover,select:hover{border-color:var(--ac)}input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--gl)}
button{transition:transform .2s,box-shadow .25s,background .25s,border-color .25s}
button.b{font-family:inherit;background:linear-gradient(135deg,var(--ac),#8a4fe0);color:#fff;border:1.5px solid var(--ac);padding:8px 18px;border-radius:10px;font-weight:700;cursor:pointer}
button.b:hover,.hbtn:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--gl)}button.b:active,.hbtn:active{transform:translateY(0) scale(.97)}
button.g{font-family:inherit;background:none;border:1.5px solid var(--st);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}button.g:hover:not(:disabled){border-color:var(--ac);background:rgba(106,50,176,.08)}
button.x{background:none;border:0;color:var(--rd);cursor:pointer;font-family:inherit;padding:2px 6px}button.x:hover{text-decoration:underline}button.e{color:var(--pr)}
button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.ok{color:var(--ok);font-weight:700}.no{color:var(--rd);font-weight:700}.w{color:var(--wn);font-weight:700}
.tg{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid currentColor}.tg.v{color:var(--ac)}
.n{color:var(--mu);font-size:12px;margin:6px 0 0}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.cds .cd{margin:0}
.cd{display:flex;flex-direction:column;gap:8px}.cd:hover{transform:translateY(-4px);box-shadow:0 12px 30px var(--gl);border-color:var(--ac)}.cd h3{margin:0;font-size:16px;color:var(--pr)}.cd .st{font-size:13px;color:var(--mu);min-height:42px}.cd button{width:100%}
.cd.in{border-color:var(--ok)}.cd.ps{border-color:var(--wn)}.cd.no0{border-color:var(--rd)}.cd.out{opacity:.88}
button.b.gr{background:var(--ok);border-color:var(--ok);color:var(--onp)}button.b.rd{background:var(--rd);border-color:var(--rd);color:var(--onp)}button.b.am{background:var(--wn);border-color:var(--wn);color:#1e0f2e}
.sh{display:flex;align-items:center;gap:8px;margin:18px 0 10px}.sh h2{margin:0}.ct{padding:2px 12px;border-radius:999px;font-weight:700;font-size:13px}.ct.g{background:var(--ok);color:var(--onp)}.ct.r{background:var(--rd);color:var(--onp)}
.dn{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(20,5,35,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:99;animation:fi .25s}
.md{max-width:350px;width:100%;margin:12px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
.ts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--pr);color:var(--onp);padding:10px 20px;border-radius:12px;z-index:100;box-shadow:0 8px 24px var(--gl);animation:tu .35s}
@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.88) translateY(10px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes tu{from{opacity:0;transform:translate(-50%,16px)}}
.anim>*,.anim .cd{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.anim>*:nth-child(2){animation-delay:.06s}.anim>*:nth-child(3){animation-delay:.12s}.anim>*:nth-child(4){animation-delay:.18s}.anim>*:nth-child(n+5){animation-delay:.24s}
.anim .cd:nth-child(3n+2){animation-delay:.08s}.anim .cd:nth-child(3n){animation-delay:.16s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,form,button,.dn{display:none!important}body{background:#fff}.box{box-shadow:none}}
</style>
</head>

var KEY='att_digigo_v1',PUB=[['punch','تسجيل الحضور والانصراف'],['day','السجل اليومي'],['log','السجل الشهري']],ADT=[['sheet','كشف الموظف'],['sum','ملخص الشهر والمرتبات'],['emp','الموظفون والإعدادات']];
var D,tab='punch',ED=null,FE='',SE='',M=rt().slice(0,7),DY=rt(),AB={c:'عارضة',a:'اعتيادية',u:'مخصومة من المرتب'};
function rt(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function seed(){var n=['مبيعات 1','مبيعات 2','مبيعات 3','مبيعات 4','مصمم 1','مصمم 2','مصمم 3','مصمم 4','مصمم 5','المونتير'];return{emp:n.map(function(x,i){return{id:'e'+i,n:x,sal:i<4?8000:i<9?9000:10000}}),att:[],set:{hrs:8,ded:0}}}
try{D=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!D||!D.emp){D=seed();try{var o=JSON.parse(localStorage.getItem('erp_mkt_v2'));if(o&&o.emp&&o.emp.length){D.emp=o.emp.map(function(e){return{id:e.id,n:e.n,sal:e.sal}});D.att=o.att||[]}}catch(x){}}
D.att=D.att||[];D.set=D.set||{};D.set.hrs=D.set.hrs||8;D.set.ded=D.set.ded||0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){}if(window.cloudSave)window.cloudSave()}
function $(i){return document.getElementById(i)}
function f(n){return Math.round(n).toLocaleString('en-US')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function emp(id){return D.emp.filter(function(e){return e.id==id})[0]}
function en(id){var x=emp(id);return x?x.n:'-'}
function inM(d){return d&&d.slice(0,7)==M}
function today(){var t=rt();return t.slice(0,7)==M?t:M+'-01'}
function wd(d){try{return new Date(d).toLocaleDateString('ar-EG',{weekday:'long'})}catch(x){return''}}
function addD(s,n){var d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function esc(v){return String(v==null?'':v).replace(/"/g,'&quot;')}
function box(h){return'<div class="box">'+h+'</div>'}
function tr(a){return'<tr>'+a.map(function(x){return'<td>'+x+'</td>'}).join('')+'</tr>'}
function table(h,rows){return'<div class="scr"><table><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>'+(rows.join('')||'<tr><td colspan="'+h.length+'" class="n">لا توجد بيانات.</td></tr>')+'</table></div>'}
function byD(a){return a.slice().sort(function(x,y){return x.d<y.d?1:x.d>y.d?-1:(x.i<y.i?1:-1)})}
function kp(a){return'<div class="kp">'+a.map(function(x){return'<div class="k"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>'}).join('')+'</div>'}

+'<h2>حساب الشهر</h2>'+box('<p style="margin:0">الأوفر '+s.ot+' د − العجز '+s.df+' د = <b>'+(s.net>0?'+':'')+s.net+' د</b></p><p class="n" style="font-size:14px">'+(s.net>0?'الصافي موجب ← يُضرب ×2 = '+s.pm+' د = <b class="ok">+'+f(s.op)+'</b>':s.net<0?'العجز أكبر ← بدون ضرب، يُخصم فقط <b class="no">-'+f(s.dc)+'</b>':'لا أوفر ولا عجز')+'</p><p class="n" style="font-size:14px">خصم أيام الغياب ('+s.ud+' يوم): <b class="no">-'+f(s.ac)+'</b></p><p style="margin:8px 0 0">المرتب الأساسي '+f(e.sal)+' ← الصافي التقديري <b class="ok">'+f(s.tot)+'</b></p>')+'<button class="b" onclick="window.print()">طباعة الكشف</button>'},
sum:function(){return admBar()+box(table(['الموظف','أيام الحضور','أوفر (د)','عجز (د)','الصافي (د)','محسوب ×2 (د)','قيمة الأوفر','خصم العجز','عارضة','اعتيادية','مخصومة (أيام)','خصم الغياب','المرتب','الصافي التقديري'],D.emp.map(function(e){var t=attSum(e);return tr([e.n,t.days,t.ot?'<span class="ok">'+t.ot+'</span>':0,t.df?'<span class="no">'+t.df+'</span>':0,t.net>0?'<b class="ok">+'+t.net+'</b>':t.net<0?'<b class="no">'+t.net+'</b>':0,t.pm||0,t.op?'<b class="ok">+'+f(t.op)+'</b>':0,t.dc?'<b class="no">-'+f(t.dc)+'</b>':0,t.c,t.a,t.ud,t.ac?'<b class="no">-'+f(t.ac)+'</b>':0,f(e.sal),'<b>'+f(t.tot)+'</b>'])})))+'<p class="n">الصافي = إجمالي الأوفر − إجمالي العجز (بالدقائق). لو موجب يُضرب ×2 ويُضاف أجره، ولو سالب يُخصم قيمة العجز فقط بدون ضرب. أجر الساعة = المرتب ÷ 30 ÷ '+D.set.hrs+'، ويوم الخصم = المرتب ÷ 30.</p><button class="b" onclick="window.print()">طباعة الملخص</button>'},
emp:function(){return admBar()+eform()+box(table(['الموظف','المرتب','أجر الساعة','الكود السري',''],D.emp.map(function(e){return tr([e.n,f(e.sal),rate(e).toFixed(2),e.ph?'<span class="ok">مُعيّن</span>':'<span class="no">غير مُعيّن</span>',act('emp',e.id)])})))+'<h2>الإعدادات</h2>'+box('<form onsubmit="return setS()"><label>ساعات العمل المطلوبة يوميًا<input id="t1" type="number" step="any" min="1" value="'+D.set.hrs+'"></label><button class="b">حفظ</button></form>')}};
function setS(){if(!ADM){lg();return false}D.set.hrs=+$('t1').value||8;save();go('emp');return false}
function nv(t){ED=null;go(t,1)}
function TABS(){return ADM?PUB.concat(ADT):PUB}
function go(t,an){if(!ADM&&ADT.some(function(x){return x[0]==t}))t='punch';tab=t;$('nav').innerHTML=TABS().map(function(x){return'<button class="'+(x[0]==t?'on':'')+'" onclick="nv(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');var b=$('ab');b.textContent=ADM?'تسجيل خروج المسؤول':'دخول المسؤول';b.onclick=ADM?lo:lg;var a=$('app');a.className=an?'anim':'';a.innerHTML=V[t]();if($('f_t'))tt()}
$('mo').value=M;$('mo').onchange=function(){M=this.value||M;go(tab,1)};
go('punch',1);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {getFirestore,collection,doc,getDocs,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

// ===== الصق الـ firebaseConfig بتاعك هنا بدل القيم دي =====
const firebaseConfig = {
  apiKey: "AIzaSyCJuhKq4FxK5Vjlg7DL5PboDPNIDzRzJys",
  authDomain: "digigo-attendance.firebaseapp.com",
  projectId: "digigo-attendance",
  storageBucket: "digigo-attendance.firebasestorage.app",
  messagingSenderId: "115847522981",
  appId: "1:115847522981:web:7cc66ff14f3b94125dbb4c"
};
// ===========================================================

function st_(m,k){var d=document.getElementById('fbst');if(!d){d=document.createElement('div');d.id='fbst';d.style.cssText='position:fixed;bottom:0;right:0;left:0;padding:8px 14px;font-size:13px;z-index:98;text-align:center;direction:rtl';document.body.appendChild(d)}d.textContent=m;d.style.background=k=='ok'?'#16895e':'#c0392b';d.style.color='#fff';if(k=='ok')setTimeout(function(){d.remove()},3000)}
const db = getFirestore(initializeApp(firebaseConfig));
const synced = {emp:{}, att:{}, set:''};
let ready = false;
const sk = o => JSON.stringify(o, Object.keys(o).sort());
const ordEmp = (a,b) => {
  const na=/^e\d+$/.test(a.id), nb=/^e\d+$/.test(b.id);
  if(na&&nb) return +a.id.slice(1)-+b.id.slice(1);
  if(na) return -1; if(nb) return 1;
  return a.id<b.id?-1:1;
};
function refresh(){
  const a=document.activeElement;
  if(ED||(a&&/INPUT|SELECT/.test(a.tagName)&&$('app').contains(a))) return;
  go(tab);
}
function push(){
  const b=writeBatch(db); let n=0;
  ['emp','att'].forEach(c=>{
    const cur={};
    D[c].forEach(x=>{cur[x.id]=sk(x)});
    Object.keys(cur).forEach(id=>{
      if(synced[c][id]!==cur[id]){b.set(doc(db,c,id),JSON.parse(cur[id]));synced[c][id]=cur[id];n++}
    });
    Object.keys(synced[c]).forEach(id=>{
      if(!(id in cur)){b.delete(doc(db,c,id));delete synced[c][id];n++}
    });
  });
  const st=sk(D.set);
  if(st!==synced.set){b.set(doc(db,'meta','settings'),D.set);synced.set=st;n++}
  if(n) b.commit().then(()=>st_('متصل بالسيرفر ✓ تم الحفظ','ok')).catch(e=>{console.error(e);st_('فشل الحفظ: '+(e.code||'')+' '+(e.message||e),'bad')});
}
window.cloudSave = () => { if(ready) push(); };

function fromSnap(c, snap){
  D[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(c==='emp') D.emp.sort(ordEmp);
  synced[c]={}; D[c].forEach(x=>{synced[c][x.id]=sk(x)});
}

(async function init(){
  try{
    const [e,a,s]=await Promise.all([getDocs(collection(db,'emp')),getDocs(collection(db,'att')),getDocs(collection(db,'meta'))]);
    if(e.empty){ // أول مرة: ارفع البيانات الحالية للسحابة
      ready=true; push();
    }else{
      fromSnap('emp',e); fromSnap('att',a);
      s.docs.forEach(d=>{if(d.id==='settings'){D.set=Object.assign({hrs:8,ded:0},d.data());synced.set=sk(D.set)}});
      ready=true;
      try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){}
    }
    st_('متصل بقاعدة البيانات ✓','ok');
    go(tab);
    onSnapshot(collection(db,'emp'),sn=>{fromSnap('emp',sn);refresh()});
    onSnapshot(collection(db,'att'),sn=>{fromSnap('att',sn);refresh()});
    onSnapshot(doc(db,'meta','settings'),d=>{if(d.exists()){D.set=Object.assign({hrs:8,ded:0},d.data());synced.set=sk(D.set);refresh()}});
  }catch(err){
    console.error(err);
    st_('فشل الاتصال: '+(err.code||'')+' '+(err.message||err),'bad');
  }
})();
</script>
